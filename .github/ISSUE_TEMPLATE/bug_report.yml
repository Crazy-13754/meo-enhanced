name: 问题反馈 / Bug report
description: 报告错误或异常表现 / Report bugs or unexpected behavior.
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述 / Problem
      description: 中文或英文均可 / Use Chinese or English.
      placeholder: |
        实际表现 / Actual behavior:
        预期结果 / Expected behavior:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现 / Reproduction
      description: 操作步骤；Markdown 问题请附最小示例 / Steps; include a minimal sample for Markdown issues.
      placeholder: |
        1. ...
        2. ...

        ```md
        最小示例 / Minimal sample
        ```
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 发生位置 / Affected area
      multiple: true
      options:
        - 实时编辑 / Live
        - 源码 / Source
        - 预览 / Preview
        - 导出 / Export
        - 其他或不确定 / Other or unsure

  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      placeholder: MEO x.x.x · VS Code x.x.x · Windows/macOS/Linux
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 截图或补充（可选） / Screenshots or details (optional)
      description: 可拖入截图或录屏 / Drop screenshots or recordings here.
